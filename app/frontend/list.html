<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article List — AI News Aggregator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1><a href="/" class="brand-link">Articles</a></h1>
    </div>
    <div class="controls">
      <span id="list-status" class="status">loading…</span>
      <button id="sort-toggle" class="btn" title="Toggle sort order">newest first</button>
    </div>
  </header>

  <main>
    <section class="feed" id="article-list" aria-label="Articles">
      <div class="empty">Loading articles…</div>
    </section>
    <div class="feed-controls">
      <button id="load-more" class="btn" hidden>Load more</button>
    </div>
  </main>

  <script src="/static/auth.js"></script>
  <script src="/static/list.js"></script>
</body>
</html>
